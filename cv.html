<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV court et imprimable de Lisa Blavot." />
    <title>CV | Lisa Blavot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body data-page="cv">
    <header class="site-header">
      <a class="brand" href="index.html">Lisa Blavot</a>
      <nav
        class="site-nav site-nav--project"
        aria-label="Navigation secondaire"
      >
        <a href="index.html#projects">Projets</a>
        <a href="index.html#skills">Compétences</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main class="section-shell cv-shell" id="cv-page">
      <section class="cv-card reveal">
        <div class="cv-topbar">
          <div>
            <p class="eyebrow">CV court</p>
            <h1>Lisa Blavot</h1>
            <p class="cv-lead">
              Étudiante en Master Informatique · développement web · projets
              visuels.
            </p>
          </div>
          <button class="button button-primary" type="button" id="print-cv">
            Télécharger en PDF
          </button>
        </div>

        <div class="cv-grid">
          <section class="cv-block">
            <h2>Profil</h2>
            <p>
              Conception d’interfaces sobres, développement de projets clairs et
              mise en valeur des livrables.
            </p>
          </section>

          <section class="cv-block">
            <h2>Compétences</h2>
            <div class="tag-row" id="cv-skills"></div>
          </section>

          <section class="cv-block">
            <h2>Parcours</h2>
            <div class="mini-timeline" id="cv-timeline"></div>
          </section>

          <section class="cv-block">
            <h2>Contact</h2>
            <div
              class="contact-links contact-links--compact"
              id="cv-contact"
            ></div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
